<perch:after>
    </select>

    <style>
        /* Basic styling for the select dropdown */
        select {
            width: 200px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            appearance: none; /* Removes default browser appearance */
            -webkit-appearance: none; /* For Safari */
            -moz-appearance: none; /* For Firefox */
            outline: none;
            cursor: pointer;
        }

        /* Styling the container to add a custom arrow */
        .select-wrapper {
            position: relative;
            width: 200px;
        }

        /* Custom arrow icon */
        .select-wrapper::after {
            content: '▼';  /* Unicode character for down arrow */
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            font-size: 14px;
            color: #333;
            pointer-events: none;  /* Prevents interference with select box clicks */
        }

        /* Option styling */
        select option {
            padding: 10px;
            font-size: 16px;
            background-color: #fff;
            color: #333;
        }

        /* Hover and focus effects */
        select:hover {
            border-color: #888;
        }

        select:focus {
            border-color: #007BFF;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
        }
    </style>



</perch:after>
